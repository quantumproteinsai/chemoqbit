name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The first version of this workflow installed nothing at system level and
      # failed on all three runs. The Dockerfile installs these, so leaving them
      # out here was an inconsistency: PySCF wants a BLAS at runtime and RDKit
      # wants the X-less image libraries even when nothing is drawn.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgomp1 libopenblas0 libxrender1 libxext6

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Run before pytest so that an import failure is reported as an import
      # failure, with its versions, rather than as a wall of collection errors.
      - name: Import check
        run: |
          python - <<'PY'
          import importlib, sys
          print('python', sys.version)
          for m in ('numpy','scipy','pyscf','tblite','rdkit','fastapi','httpx','starlette'):
              try:
                  mod = importlib.import_module(m)
                  print('  %-10s %s' % (m, getattr(mod, '__version__', 'ok')))
              except Exception as e:
                  print('  %-10s FAILED: %s: %s' % (m, type(e).__name__, e))
                  raise
          import chemoqbit
          print('chemoqbit imports')
          PY

      - name: Run the test suite
        run: pytest -v -ra --tb=long

      - name: Check the physical sanity bounds against their known cases
        # every bound in chemoqbit/sanity.py is exercised in both directions:
        # the archived failures must fire, the audited results must stay silent
        run: python scripts/test_checks.py
