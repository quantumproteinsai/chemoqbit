[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemoqbit"
version = "1.2.0"
description = "Reaction energetics on qubits, from molecular integrals to the instruction stream of an FPGA state-vector simulator"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Bertrand Mercier des Rochettes", email = "contact@quantum-proteins.ai" },
]
keywords = [
    "quantum chemistry",
    "variational quantum eigensolver",
    "ADAPT-VQE",
    "QAOA",
    "fixed-point arithmetic",
    "FPGA",
    "enzyme catalysis",
    "tunnelling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "pyscf>=2.6",
    # the enzyme pipeline calls GFN2-xTB through tblite for every scan point;
    # it was missing from requirements.txt, so an install from that file alone
    # could not run any of the cluster work
    "tblite>=0.3",
    "geometric>=1.1",
    "rdkit>=2024.3",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8",
    "httpx>=0.27",      # the FastAPI TestClient needs it
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/quantumproteinsai/chemoqbit"
Repository = "https://github.com/quantumproteinsai/chemoqbit"
Issues = "https://github.com/quantumproteinsai/chemoqbit/issues"

[tool.setuptools.packages.find]
include = ["chemoqbit*", "service*"]

[tool.setuptools.package-data]
"chemoqbit.fold" = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
